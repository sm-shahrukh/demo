<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta
      name="description"
      content="Enter traveller details for your Smart Moves flight booking passengers, passport information and contact details then review the fare before payment."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <!-- Shared page styles and the dedicated booking-flow styles. -->
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/flight-booking.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <title>Flight booking | Smart Moves</title>
  </head>
  <body id="app">
    <!-- ========================================== NAVIGATION BAR START ========================================== -->
    <div data-site-header></div>
    <!-- ========================================== NAVIGATION BAR END ========================================== -->

    <main class="bk-main" id="bkApp">
      <div class="bk-wrap">
        <!-- Shared header band: back link, title, subtitle, reservation clock -->
        <div class="bk-band">
          <div class="bk-band-top">
            <div>
              <a class="bk-back" id="bkBack" href="/search-flight.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="19" y1="12" x2="5" y2="12" />
                  <polyline points="12 19 5 12 12 5" />
                </svg>
                <span data-role="back-label">Back to traveler details</span>
              </a>
              <h1 class="bk-title" data-role="title">Traveler details</h1>
              <p class="bk-sub" data-role="sub">
                Save time, and you&rsquo;re one step closer to London.
              </p>
            </div>
            <div class="bk-clock" id="bkClock">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              <span>Reservation time <b id="bkClockValue">08:00</b></span>
            </div>
          </div>
        </div>

        <!-- Step indicator is rebuilt by js/flight-booking.js -->
        <ol class="bk-steps" id="bkSteps"></ol>

        <div class="bk-layout">
          <!-- ---------- Screen column (rendered per step) ---------- -->
          <div class="bk-main-col" id="bkScreen"></div>

          <!-- ---------- Right rail (rendered per step) ---------- -->
          <aside class="bk-rail" id="bkRail" aria-label="Booking summary"></aside>
        </div>
      </div>
    </main>

    <!-- ========================================== FOOTER START ========================================== -->
    <div data-site-footer></div>
    <!-- ========================================== FOOTER END ========================================== -->

    <button
      class="scroll-top"
      id="backToTop"
      data-action="scrollToTop"
      aria-label="Scroll to top"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="m18 15-6-6-6 6" />
      </svg>
    </button>

    <div class="bk-toast" id="bkToast" role="status" aria-live="polite" hidden></div>



    <template id="tplAddonsHead">
      <section class="bk-card">
        <div class="bk-card-body">
          <div class="bk-note bk-note-info" data-role="note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="11" x2="12" y2="16" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
            <span data-role="txt"></span>
          </div>
          <div data-role="dirs"></div>
          <div data-role="tabs"></div>
          <div data-role="ctx"></div>
          <div data-role="addon-tabs"></div>
        </div>
      </section>
    </template>

    <template id="tplBagCard">
      <section class="bk-card" id="bkBagSec">
        <div class="bk-card-head">
          <h2 class="bk-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
            Add extra baggage
          </h2>
          <span class="bk-card-sub">Charged per passenger, per flight</span>
        </div>
        <div class="bk-card-body">
          <div data-role="ctx"></div>
          <div class="bk-note bk-note-soft">
            <div class="bk-flex-1">
              Choose one checked-baggage option for this traveler and flight.
              “No extra bag” keeps the baggage allowance included with the selected fare.
            </div>
          </div>
          <div class="bk-mt-16" data-role="options"></div>
        </div>
      </section>
    </template>

    <template id="tplMealCard">
      <section class="bk-card" id="bkMealSec">
        <div class="bk-card-head">
          <h2 class="bk-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 2v7a3 3 0 0 0 3 3v10" />
              <path d="M6 2v6" />
              <path d="M9 2v6" />
              <path d="M18 2c-1.5 2-2 4-2 6 0 1.7.7 3 2 3s2-1.3 2-3c0-2-.5-4-2-6z" />
              <path d="M18 11v11" />
            </svg>
            Choose a meal
          </h2>
          <span class="bk-card-sub">Per passenger, per flight</span>
        </div>
        <div class="bk-card-body">
          <div data-role="ctx"></div>
          <div class="bk-note bk-note-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="11" x2="12" y2="16" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
            <span>
              Standard, vegetarian and gluten-free meals are included in your fare.
              Special meals are charged per flight. Infant meals travel on an adult's lap.
            </span>
          </div>
          <div class="bk-mt-16" data-role="options"></div>
        </div>
      </section>
    </template>

    <template id="tplSeatCard">
      <section class="bk-card">
        <div class="bk-card-head">
          <h2 class="bk-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M5 11V7a2 2 0 0 1 4 0v4h6V9a2 2 0 0 1 4 0v6a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-4z"
              />
              <path d="M7 17v4" />
            </svg>
            Choose your seat
          </h2>
          <span class="bk-badge bk-badge-required">Required</span>
          <span class="bk-card-sub" data-role="sub"></span>
        </div>
        <div class="bk-card-body">
          <div data-role="ctx"></div>
          <div class="bk-note bk-note-info" data-role="note"></div>
          <div class="bk-seat-wrap">
            <div class="bk-seat-inner">
              <div class="bk-legend" data-role="legend"></div>
              <div data-role="grid"></div>
            </div>
          </div>
          <div data-role="picked"></div>
        </div>
      </section>
    </template>

    <template id="tplAddonsFoot">
      <section class="bk-card">
        <div class="bk-card-body">
          <div class="bk-addons-head">
            <div class="bk-addons-who">
              <span class="bk-addons-flag" data-role="flag"></span>
              <b data-role="who"></b>
              <span class="bk-addons-meta" data-role="meta"></span>
            </div>
            <div class="bk-prog" role="progressbar" aria-valuemin="0" data-role="prog"></div>
          </div>
          <div class="bk-btn-row bk-mt-16">
            <button
              type="button"
              class="bk-btn bk-btn-outline"
              data-summary="1"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1a2 2 0 0 0 0 4v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1a2 2 0 0 0 0-4z"
                />
                <path d="M13 5v2" />
                <path d="M13 17v2" />
                <path d="M13 11v2" />
              </svg>
              View everyone's choices
            </button>
            <button type="button" class="bk-btn bk-btn-primary" data-role="advance"></button>
          </div>
          <div class="bk-btn-row bk-mt-10">
            <button type="button" class="bk-link" data-go-review="1">
              Skip ahead and review everyone's choices
            </button>
          </div>
          <p class="bk-fine bk-mt-10">
            Nothing is charged yet. Review and change every choice before payment.
          </p>
        </div>
      </section>
    </template>

    <template id="tplSummaryModal">
      <section class="bk-modal" data-summary-close="1">
        <div class="bk-modal-box" role="dialog" aria-modal="true" aria-label="Review add-ons">
          <div class="bk-modal-head">
            <button
              type="button"
              class="bk-modal-x"
              data-summary-close="1"
              aria-label="Close"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
            <h2 class="bk-modal-title">Everyone&rsquo;s choices</h2>
            <p class="bk-modal-sub" data-role="sub"></p>
          </div>
          <div class="bk-modal-body" id="bkSummaryBody" data-role="body"></div>
          <div class="bk-modal-foot">
            <div data-role="status"></div>
            <span class="bk-modal-total" data-role="total"></span>
            <button type="button" class="bk-btn bk-btn-primary" data-summary-next="1">
              Continue to review
            </button>
          </div>
        </div>
      </section>
    </template>

    <script src="/js/pages.js"></script>
    <script src="/js/flight-booking.js"></script>
    <script src="/js/auth-modal.js"></script>
    <script src="js/site-layout.js" defer></script>
    <script src="/js/site-actions.js" defer></script>

  </body>
</html>
