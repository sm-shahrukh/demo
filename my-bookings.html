<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta
      name="description"
      content="View your upcoming and past flight bookings with Smart Moves e-tickets, itineraries, print and cancellation in one place."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <title>My Bookings | Smart Moves</title>
  </head>
  <body id="app">
    <!-- ========================================== NAVIGATION BAR START ========================================== -->
    <div data-site-header></div>
    <!-- ========================================== NAVIGATION BAR END ========================================== -->

    <!-- ========================================== PAGE BANNER ========================================== -->
    <section class="page-banner">
      <div class="page-banner-inner">
        <span class="page-banner-badge">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="u-icon-16"
          >
            <path d="M4 4h16v4H4z" />
            <path d="M4 12h16v8H4z" />
            <path d="M8 8h.01M8 16h.01" />
          </svg>
          Ahmed Shah
        </span>
        <h1 class="page-banner-title">My Bookings</h1>
        <p class="page-banner-text">
          Every reservation on your account, with e-tickets, itineraries and
          changes in one place.
        </p>
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
          <a href="/index.html">Home</a>
          <span class="sep">/</span>
          <span class="current">My Bookings</span>
        </nav>
      </div>
    </section>

    <main class="bookings-shell" id="bookingsApp">
      <!-- ---------- Summary ---------- -->
      <section class="booking-stats">
        <div class="bstat">
          <div class="bstat-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="7" width="20" height="14" rx="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
          </div>
          <div class="bstat-value" id="statUpcoming">0</div>
          <div class="bstat-label">Upcoming</div>
        </div>

        <div class="bstat">
          <div class="bstat-icon green">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </div>
          <div class="bstat-value" id="statCompleted">0</div>
          <div class="bstat-label">Completed</div>
        </div>

        <div class="bstat">
          <div class="bstat-icon gray">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </div>
          <div class="bstat-value" id="statCancelled">0</div>
          <div class="bstat-label">Cancelled</div>
        </div>

        <div class="bstat">
          <div class="bstat-icon amber">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 4h16v4H4z" />
              <path d="M4 12h16v8H4z" />
              <path d="M8 8h.01M8 16h.01" />
            </svg>
          </div>
          <div class="bstat-value" id="statTotal">0</div>
          <div class="bstat-label">Total bookings</div>
        </div>
      </section>

      <!-- ---------- Toolbar ---------- -->
      <section class="booking-toolbar">
        <div class="booking-search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="search"
            id="bookingSearch"
            placeholder="Search by reference, airline, flight number or city…"
            aria-label="Search bookings"
          />
        </div>

        <div class="booking-tabs" role="tablist" aria-label="Filter bookings">
          <button
            type="button"
            class="btab active"
            data-filter="all"
            role="tab"
            aria-selected="true"
          >
            All <span class="btab-count">0</span>
          </button>
          <button
            type="button"
            class="btab"
            data-filter="upcoming"
            role="tab"
            aria-selected="false"
          >
            Upcoming <span class="btab-count">0</span>
          </button>
          <button
            type="button"
            class="btab"
            data-filter="completed"
            role="tab"
            aria-selected="false"
          >
            Completed <span class="btab-count">0</span>
          </button>
          <button
            type="button"
            class="btab"
            data-filter="cancelled"
            role="tab"
            aria-selected="false"
          >
            Cancelled <span class="btab-count">0</span>
          </button>
        </div>
      </section>

      <!-- ---------- List ---------- -->
      <section id="bookingList" aria-live="polite"></section>

      <div class="bookings-empty" id="bookingsEmpty">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <path d="M2 7h20v13H2z" />
          <path d="M16 20V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v15" />
        </svg>
        <h3>Nothing here yet</h3>
        <p></p>
        <a
          href="/search-flight.html"
          class="bc-btn primary u-mt-8"

        >
          Browse Flights
        </a>
      </div>
    </main>

    <!-- Print-only target, revealed by the @media print rules in pages.css -->
    <div id="printArea"></div>

    <!-- ---------- Modal ---------- -->
    <div
      class="bk-modal"
      id="bkModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="bkModalTitle"
    >
      <div class="bk-modal-box">
        <div class="bk-modal-icon" id="bkModalIcon"></div>
        <h2 class="bk-modal-title" id="bkModalTitle"></h2>
        <p class="bk-modal-text" id="bkModalText"></p>
        <span class="bk-modal-ref" id="bkModalRef"></span>
        <div class="bk-modal-actions" id="bkModalActions"></div>
      </div>
    </div>

    <!-- ========================================== FOOTER START ========================================== -->
    <div data-site-footer></div>
    <!-- ========================================== FOOTER END ========================================== -->

    <button
      class="scroll-top"
      id="backToTop"
      data-action="scrollToTop"
      aria-label="Scroll to top"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="m18 15-6-6-6 6" />
      </svg>
    </button>

    <script src="/js/bookings-data.js"></script>
    <script src="/js/pages.js"></script>
    <script src="/js/auth-modal.js"></script>
    <script src="js/site-layout.js" defer></script>
    <script src="/js/site-actions.js" defer></script>

  </body>
</html>
